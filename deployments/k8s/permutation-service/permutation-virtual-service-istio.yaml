apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: permutation-vs
spec:
  hosts:
  - "*"
  gateways:
  - main-gateway   # <--- Points to the shared front door
  http:
  - match:
    - uri:
        prefix: /api/permutation  # <--- Only catches Permutation traffic
    route:
    - destination:
        host: permutation-service
        port:
          number: 80