apiVersion: v1
kind: Service
metadata:
  name: permutation-service
  labels:
    app: permutation-service
spec:
  type: NodePort
  selector:
    app: permutation-service
  ports:
    - name: http
      port: 80
      targetPort: 5001
      nodePort: 30000     # <-- The port your external VM will hit
      protocol: TCP