apiVersion: v1
kind: Service
metadata:
  name: permutation-service
  labels:
    app: permutation-service
spec:
  type: NodePort
  selector:
    app: permutation-service
  ports:
    - name: http
      port: 80
      targetPort: 5001
      nodePort: 30100     # Distinct from baseline (30000)
      protocol: TCP