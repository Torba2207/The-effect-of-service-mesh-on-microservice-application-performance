apiVersion: apps/v1
kind: Deployment
metadata:
  name: permutation-service
  labels:
    app: permutation-service
spec:
  replicas: 5
  selector:
    matchLabels:
      app: permutation-service
  template:
    metadata:
      labels:
        app: permutation-service
    spec:
      containers:
      - name: permutation-service
        image: ghcr.io/torba2207/permutation-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5001
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: permutation-service
  labels:
    app: permutation-service
spec:
  type: ClusterIP
  selector:
    app: permutation-service
  ports:
    - name: http
      port: 80
      targetPort: 5001
      protocol: TCP