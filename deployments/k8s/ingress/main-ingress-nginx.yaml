apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  namespace: thesis-test
  annotations:
    # Route to the Service ClusterIP (not individual pod endpoints) so the meshed
    # ingress controller's linkerd-proxy can do service discovery and mTLS to backends.
    # Required for north-south (ingress->service) mTLS in the Linkerd phase.
    nginx.ingress.kubernetes.io/service-upstream: "true"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /api/Ai
        pathType: Prefix
        backend:
          service:
            name: ai-service
            port:
              number: 80
      - path: /api/permutation
        pathType: Prefix
        backend:
          service:
            name: permutation-service
            port:
              number: 80
      - path: /api/fibonacci
        pathType: Prefix
        backend:
          service:
            name: fibonacci-service
            port:
              number: 80
      - path: /api/integration
        pathType: Prefix
        backend:
          service:
            name: integration-service
            port:
              number: 80
      - path: /api/differential
        pathType: Prefix
        backend:
          service:
            name: differential-equations-service
            port:
              number: 80
      - path: /api/filters
        pathType: Prefix
        backend:
          service:
            name: digital-filters-service
            port:
              number: 80
      - path: /api/video
        pathType: Prefix
        backend:
          service:
            name: video-service
            port:
              number: 80
