apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: digital-filters-vs
spec:
  hosts:
  - "*"
  gateways:
  - main-gateway
  http:
  - match:
    - uri:
        prefix: /api/filters
    route:
    - destination:
        host: digital-filters-service
        port:
          number: 80