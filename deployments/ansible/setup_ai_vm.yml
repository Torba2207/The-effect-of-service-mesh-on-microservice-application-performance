---
- name: Setup AI Service VM with Docker
  hosts: ai_vms # Make sure to add this group to your inventory.ini
  become: yes
  tasks:
    - name: Remove old conflicting Docker repository list
      file:
        path: /etc/apt/sources.list.d/docker.sources
        state: absent

    - name: Remove old conflicting Docker legacy repository list
      file:
        path: /etc/apt/sources.list.d/docker.list
        state: absent

    - name: Remove old conflicting Docker GPG key
      file:
        path: /etc/apt/keyrings/docker.gpg
        state: absent

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install prerequisite packages
      apt:
        name:
          - ca-certificates
          - curl
          - git
          - apt-transport-https
        state: present

    - name: Create directory for Docker's GPG key
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Remove old conflicting Docker repository list
      file:
        path: /etc/apt/sources.list.d/docker.list
        state: absent

    - name: Remove old conflicting Docker GPG key
      file:
        path: /etc/apt/keyrings/docker.gpg
        state: absent

    - name: Download Docker's official GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository
      deb822_repository:
        name: docker
        types: deb
        architectures: amd64
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker service is started and enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create project directory for thesis code
      file:
        path: /opt/service-mesh-thesis
        state: directory
        mode: '0755'
