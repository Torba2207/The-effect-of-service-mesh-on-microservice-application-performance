---
- name: Apply Istio Deployments and Services
  hosts: localhost
  gather_facts: false
  vars:
    namespace: thesis-test
    k8s_dir: "{{ playbook_dir }}/../k8s"
    istio_dir: "{{ playbook_dir }}/../istio"
  tasks:
    - name: Ensure thesis namespace exists with Istio injection label
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ namespace }}"
            labels:
              istio-injection: enabled

    - name: Apply Istio main gateway
      kubernetes.core.k8s:
        state: present
        namespace: "{{ namespace }}"
        src: "{{ istio_dir }}/istio-main-gateway.yaml"

    - name: Apply Istio app deployments, services, and virtual services
      kubernetes.core.k8s:
        state: present
        namespace: "{{ namespace }}"
        src: "{{ item }}"
      loop:
        # Permutation Service
        - "{{ k8s_dir }}/permutation-service/permutation-service-istio-latest.yaml"
        - "{{ k8s_dir }}/permutation-service/permutation-service-istio-service.yaml"
        - "{{ k8s_dir }}/permutation-service/permutation-virtual-service-istio.yaml"
        
        # Integration Service
        - "{{ k8s_dir }}/integration-service/integration-service-istio-latest.yaml"
        - "{{ k8s_dir }}/integration-service/integration-service-istio-service.yaml"
        - "{{ k8s_dir }}/integration-service/integration-virtual-service-istio.yaml"

        # Fibonacci Service
        - "{{ k8s_dir }}/fibonacci-service/fibonacci-service-istio-latest.yaml"
        - "{{ k8s_dir }}/fibonacci-service/fibonacci-service-istio-service.yaml"
        - "{{ k8s_dir }}/fibonacci-service/fibonacci-virtual-service-istio.yaml"
        
        # AI Service (External Bridge)
        - "{{ k8s_dir }}/ai-service/ai-service-external.yaml"
        
        # -------------------------------------------------------------
        # NOTE: Add the remaining services (Fibonacci, Video, etc.) 
        # here as you finish writing their Istio VirtualServices!
        # -------------------------------------------------------------