---
- name: Deploy Linkerd Environment (Hybrid)
  hosts: localhost
  gather_facts: false
  vars:
    test_ns: thesis-test
    app_dir: ../k8s
  tasks:
    - name: Install NGINX Ingress Controller for Baremetal
      ansible.builtin.shell: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/baremetal/deploy.yaml

    - name: Wait for NGINX Ingress Controller to become ready
      ansible.builtin.shell: kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=120s

    - name: Ensure NGINX Controller uses static NodePorts (30080 HTTP, 30443 HTTPS)
      ansible.builtin.shell: kubectl patch svc ingress-nginx-controller -n ingress-nginx --type='json' -p='[{"op":"replace","path":"/spec/ports/0/nodePort","value":30080},{"op":"replace","path":"/spec/ports/1/nodePort","value":30443}]'

    - name: Install Linkerd CRDs (Imperative CLI)
      ansible.builtin.shell: linkerd install --crds | kubectl apply -f -

    - name: Install Linkerd Core (Imperative CLI)
      ansible.builtin.shell: linkerd install | kubectl apply -f -

    - name: Verify Linkerd installation
      ansible.builtin.command: linkerd check

    # Mesh the NGINX ingress controller so north-south (ingress->service) traffic also
    # carries mTLS, making it comparable to Istio's meshed ingress gateway. Only the
    # controller Deployment is injected (NOT the ingress-nginx namespace) so the one-shot
    # admission Jobs are left unmeshed and can complete.
    - name: Inject Linkerd proxy into the NGINX Ingress Controller
      ansible.builtin.shell: >
        kubectl patch deployment ingress-nginx-controller -n ingress-nginx --type merge
        -p '{"spec":{"template":{"metadata":{"annotations":{"linkerd.io/inject":"enabled"}}}}}'

    - name: Wait for the meshed NGINX Ingress Controller to roll out
      ansible.builtin.shell: kubectl rollout status deployment/ingress-nginx-controller -n ingress-nginx --timeout=180s

    - name: Ensure thesis namespace exists with Linkerd injection annotation
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ test_ns }}"
            annotations:
              linkerd.io/inject: enabled

    - name: Apply Linkerd App Deployments and configs
      kubernetes.core.k8s:
        state: present
        namespace: "{{ test_ns }}"
        src: "{{ item }}"
      loop:
        - "{{ app_dir }}/permutation-service/permutation-linkerd-deployment.yaml"
        - "{{ app_dir }}/permutation-service/permutation-linkerd-service.yaml"
        - "{{ app_dir }}/integration-service/integration-linkerd-deployment.yaml"
        - "{{ app_dir }}/integration-service/integration-linkerd-service.yaml"
        - "{{ app_dir }}/fibonacci-service/fibonacci-linkerd-deployment.yaml"
        - "{{ app_dir }}/fibonacci-service/fibonacci-linkerd-service.yaml"
        - "{{ app_dir }}/ai-service/ai-service-external.yaml"
        - "{{ app_dir }}/differential-equations-service/differential-equations-linkerd-deployment.yaml"
        - "{{ app_dir }}/differential-equations-service/differential-equations-linkerd-service.yaml"
        - "{{ app_dir }}/video-service/video-linkerd-deployment.yaml"
        - "{{ app_dir }}/video-service/video-linkerd-service.yaml"
        - "{{ app_dir }}/digital-filters-service/digital-filters-linkerd-deployment.yaml"
        - "{{ app_dir }}/digital-filters-service/digital-filters-linkerd-service.yaml"
        - "{{ app_dir }}/ingress/main-ingress-nginx.yaml"
