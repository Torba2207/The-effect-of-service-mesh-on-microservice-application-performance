---
- name: Re-apply and Force Restart Deployments
  hosts: localhost
  gather_facts: false
  vars:
    namespace: thesis-test
    k8s_dir: "{{ playbook_dir }}/../k8s"
  tasks:
    - name: Re-apply all baseline deployments (picks up YAML changes)
      kubernetes.core.k8s:
        state: present
        namespace: "{{ namespace }}"
        src: "{{ item }}"
      loop:
        - "{{ k8s_dir }}/differential-equations-service/differential-equations-service-deployment.yaml"
        - "{{ k8s_dir }}/fibonacci-service/fibonacci-service-deployment.yaml"
        - "{{ k8s_dir }}/integration-service/integration-service-deployment.yaml"
        - "{{ k8s_dir }}/permutation-service/permutation-service-latest.yaml"
        - "{{ k8s_dir }}/video-service/video-service-deployment.yaml"

    - name: Force Rollout Restart (picks up new images if YAML tag didn't change)
      command: >
        kubectl rollout restart deployment
        differential-equations-service
        fibonacci-service
        integration-service
        permutation-service
        video-service
        -n {{ namespace }}
