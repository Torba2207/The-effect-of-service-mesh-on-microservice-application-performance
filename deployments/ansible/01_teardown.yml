---
- name: Teardown All Meshes and Applications
  hosts: localhost
  gather_facts: false
  vars:
    test_ns: thesis-test
  tasks:
    # Consul's API Gateway controller puts gateway-finalizer.consul.hashicorp.com on the Gateway
    # API objects in thesis-test. Deleting them first, while the controller still runs, lets it
    # finalize them; left to the namespace deletion they outlived the 60 s wait below and then
    # helm uninstall removed the controller, leaving the namespace Terminating forever.
    - name: Delete Gateway API routes and gateways in thesis namespace while their controller runs
      ansible.builtin.shell: |
        for kind in httproutes grpcroutes tcproutes gateways; do
          kubectl -n {{ test_ns }} delete "$kind.gateway.networking.k8s.io" --all --ignore-not-found --wait=true --timeout=60s 2>/dev/null || true
        done
      args:
        executable: /bin/bash
      changed_when: false
      ignore_errors: true

    - name: Ensure thesis namespace is absent
      kubernetes.core.k8s:
        name: "{{ test_ns }}"
        api_version: v1
        kind: Namespace
        state: absent
        wait: true
        wait_timeout: 60
      ignore_errors: true

    - name: Uninstall Istio (Imperative CLI)
      ansible.builtin.command: istioctl uninstall --purge -y
      ignore_errors: true

    - name: Ensure Istio system namespace is absent
      kubernetes.core.k8s:
        name: istio-system
        api_version: v1
        kind: Namespace
        state: absent
        wait: true
        wait_timeout: 60
      ignore_errors: true

    # Must run BEFORE the Linkerd uninstall: the Linkerd phase injects linkerd-proxy into the
    # ingress-nginx controller, and `linkerd uninstall` refuses to run while any injected pod
    # outside the control plane still exists.
    - name: Uninstall NGINX Ingress Controller
      ansible.builtin.shell: kubectl delete --ignore-not-found --wait=true -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/baremetal/deploy.yaml
      ignore_errors: true

    # --force covers injected pods that outlive the 60 s namespace wait above; they are being
    # deleted anyway. pipefail matters: without it a refusal leaves stdout empty, and
    # `kubectl delete -f -` on empty input exits 0, so the task reported "changed" while the
    # whole control plane stayed up. The assert below is the real gate.
    - name: Uninstall Linkerd (Imperative CLI)
      ansible.builtin.shell: |
        set -o pipefail
        linkerd uninstall --force | kubectl delete --ignore-not-found -f -
      args:
        executable: /bin/bash
      ignore_errors: true

    # A surviving proxy-injector webhook would inject linkerd-proxy into the next phase's pods
    # and silently contaminate its measurements, so fail the teardown instead.
    - name: Assert Linkerd is fully removed
      ansible.builtin.shell: |
        kubectl wait --for=delete namespace/linkerd --timeout=120s >/dev/null 2>&1 || true
        left="$(
          kubectl get namespace linkerd -o name 2>/dev/null
          kubectl get crd -o name | grep 'linkerd\.io'
          kubectl get mutatingwebhookconfiguration,validatingwebhookconfiguration -o name | grep linkerd
        )"
        if [ -n "$left" ]; then
          echo "Linkerd leftovers after teardown:"; echo "$left"; exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false

    # Consul config-entry resources (ProxyDefaults, ServiceIntentions, ...) carry the
    # finalizers.consul.hashicorp.com finalizer, which only the connect-injector removes.
    # helm uninstall deletes the injector first, so any such resource still present then
    # blocks its CRD and namespace forever. Delete them while the injector is still running.
    - name: Delete Consul custom resources while the controller can still finalize them
      ansible.builtin.shell: |
        for crd in $(kubectl get crd -o name | grep 'consul\.hashicorp\.com' | cut -d/ -f2); do
          kubectl delete "$crd" --all -A --ignore-not-found --wait=true --timeout=60s
        done
      args:
        executable: /bin/bash
      ignore_errors: true

    # Consul is a Helm release. Uninstall only when helm is present and the release exists,
    # so a workstation without helm can still tear down the other meshes.
    - name: Uninstall Consul (Helm)
      ansible.builtin.shell: |
        if command -v helm >/dev/null && helm -n consul status consul >/dev/null 2>&1; then
          helm -n consul uninstall consul --wait --timeout 5m
        fi
      args:
        executable: /bin/bash
      ignore_errors: true

    # Fallback for a resource that survived the step above (e.g. the injector was already
    # gone): with no controller left, strip the finalizer so deletion can complete.
    - name: Strip Consul finalizers left without a controller
      ansible.builtin.shell: |
        for crd in $(kubectl get crd -o name | grep 'consul\.hashicorp\.com' | cut -d/ -f2); do
          kubectl get "$crd" -A -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' |
          while read -r ns name; do
            [ -n "$name" ] || continue
            kubectl -n "$ns" patch "$crd" "$name" --type=merge -p '{"metadata":{"finalizers":[]}}'
          done
        done
      args:
        executable: /bin/bash
      ignore_errors: true

    - name: Strip Consul finalizers from Gateway API objects left without a controller
      ansible.builtin.shell: |
        for kind in httproutes grpcroutes tcproutes gateways; do
          kubectl get "$kind.gateway.networking.k8s.io" -A \
            -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{" "}{.metadata.finalizers}{"\n"}{end}' 2>/dev/null |
          grep 'consul\.hashicorp\.com' |
          while read -r ns name _; do
            kubectl -n "$ns" patch "$kind.gateway.networking.k8s.io" "$name" --type=merge -p '{"metadata":{"finalizers":[]}}'
          done
        done
      args:
        executable: /bin/bash
      ignore_errors: true

    # The next phase cannot create anything in a Terminating namespace.
    - name: Assert the thesis namespace is gone
      ansible.builtin.shell: |
        kubectl wait --for=delete namespace/{{ test_ns }} --timeout=120s >/dev/null 2>&1 || true
        if kubectl get namespace {{ test_ns }} -o name 2>/dev/null | grep -q .; then
          echo "namespace {{ test_ns }} still exists:"
          kubectl get namespace {{ test_ns }} -o jsonpath='{range .status.conditions[*]}{.type}: {.message}{"\n"}{end}'
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false

    # helm uninstall leaves the server StatefulSet's PVCs behind; a later install would then
    # start from the old Raft store and catalog. Deleting the namespace removes them.
    - name: Ensure Consul namespace (and its server volumes) is absent
      kubernetes.core.k8s:
        name: consul
        api_version: v1
        kind: Namespace
        state: absent
        wait: true
        wait_timeout: 120
      ignore_errors: true

    - name: Remove Consul CRDs left behind by the chart
      ansible.builtin.shell: |
        kubectl get crd -o name | grep 'consul\.hashicorp\.com' | xargs -r kubectl delete --wait=true --timeout=120s
      args:
        executable: /bin/bash
      ignore_errors: true

    # A surviving connect-injector webhook would keep acting on pods in namespaces labelled
    # consul-inject=enabled; fail the teardown rather than leave it behind.
    - name: Assert Consul is fully removed
      ansible.builtin.shell: |
        kubectl wait --for=delete namespace/consul --timeout=120s >/dev/null 2>&1 || true
        left="$(
          kubectl get namespace consul -o name 2>/dev/null
          kubectl get crd -o name | grep 'consul\.hashicorp\.com'
          kubectl get mutatingwebhookconfiguration,validatingwebhookconfiguration -o name | grep consul
        )"
        if [ -n "$left" ]; then
          echo "Consul leftovers after teardown:"; echo "$left"; exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false
