---
- name: Teardown All Meshes and Applications
  hosts: localhost
  gather_facts: false
  vars:
    test_ns: thesis-test
  tasks:
    - name: Ensure thesis namespace is absent
      kubernetes.core.k8s:
        name: "{{ test_ns }}"
        api_version: v1
        kind: Namespace
        state: absent
        wait: true
        wait_timeout: 60
      ignore_errors: true

    - name: Uninstall Istio (Imperative CLI)
      ansible.builtin.command: istioctl uninstall --purge -y
      ignore_errors: true

    - name: Ensure Istio system namespace is absent
      kubernetes.core.k8s:
        name: istio-system
        api_version: v1
        kind: Namespace
        state: absent
        wait: true
        wait_timeout: 60
      ignore_errors: true

    # Must run BEFORE the Linkerd uninstall: the Linkerd phase injects linkerd-proxy into the
    # ingress-nginx controller, and `linkerd uninstall` refuses to run while any injected pod
    # outside the control plane still exists.
    - name: Uninstall NGINX Ingress Controller
      ansible.builtin.shell: kubectl delete --ignore-not-found --wait=true -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/baremetal/deploy.yaml
      ignore_errors: true

    # --force covers injected pods that outlive the 60 s namespace wait above; they are being
    # deleted anyway. pipefail matters: without it a refusal leaves stdout empty, and
    # `kubectl delete -f -` on empty input exits 0, so the task reported "changed" while the
    # whole control plane stayed up. The assert below is the real gate.
    - name: Uninstall Linkerd (Imperative CLI)
      ansible.builtin.shell: |
        set -o pipefail
        linkerd uninstall --force | kubectl delete --ignore-not-found -f -
      args:
        executable: /bin/bash
      ignore_errors: true

    # A surviving proxy-injector webhook would inject linkerd-proxy into the next phase's pods
    # and silently contaminate its measurements, so fail the teardown instead.
    - name: Assert Linkerd is fully removed
      ansible.builtin.shell: |
        kubectl wait --for=delete namespace/linkerd --timeout=120s >/dev/null 2>&1 || true
        left="$(
          kubectl get namespace linkerd -o name 2>/dev/null
          kubectl get crd -o name | grep 'linkerd\.io'
          kubectl get mutatingwebhookconfiguration,validatingwebhookconfiguration -o name | grep linkerd
        )"
        if [ -n "$left" ]; then
          echo "Linkerd leftovers after teardown:"; echo "$left"; exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false

    # Consul is a Helm release. Uninstall only when helm is present and the release exists,
    # so a workstation without helm can still tear down the other meshes.
    - name: Uninstall Consul (Helm)
      ansible.builtin.shell: |
        if command -v helm >/dev/null && helm -n consul status consul >/dev/null 2>&1; then
          helm -n consul uninstall consul --wait --timeout 5m
        fi
      args:
        executable: /bin/bash
      ignore_errors: true

    # helm uninstall leaves the server StatefulSet's PVCs behind; a later install would then
    # start from the old Raft store and catalog. Deleting the namespace removes them.
    - name: Ensure Consul namespace (and its server volumes) is absent
      kubernetes.core.k8s:
        name: consul
        api_version: v1
        kind: Namespace
        state: absent
        wait: true
        wait_timeout: 120
      ignore_errors: true

    - name: Remove Consul CRDs left behind by the chart
      ansible.builtin.shell: |
        kubectl get crd -o name | grep 'consul\.hashicorp\.com' | xargs -r kubectl delete --wait=true
      args:
        executable: /bin/bash
      ignore_errors: true

    # A surviving connect-injector webhook would keep acting on pods in namespaces labelled
    # consul-inject=enabled; fail the teardown rather than leave it behind.
    - name: Assert Consul is fully removed
      ansible.builtin.shell: |
        left="$(
          kubectl get namespace consul -o name 2>/dev/null
          kubectl get crd -o name | grep 'consul\.hashicorp\.com'
          kubectl get mutatingwebhookconfiguration,validatingwebhookconfiguration -o name | grep consul
        )"
        if [ -n "$left" ]; then
          echo "Consul leftovers after teardown:"; echo "$left"; exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false
