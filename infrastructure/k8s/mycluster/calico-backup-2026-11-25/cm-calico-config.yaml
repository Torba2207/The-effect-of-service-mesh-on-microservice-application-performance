apiVersion: v1
data:
  calico_backend: vxlan
  cluster_type: kubespray
  cni_network_config: |-
    {
      "name": "k8s-pod-network",
      "cniVersion":"0.3.1",
      "plugins":[
        {
                      "datastore_type": "kubernetes",
            "nodename": "__KUBERNETES_NODE_NAME__",
                      "type": "calico",
            "log_level": "info",
                      "log_file_path": "/var/log/calico/cni/cni.log",
                                          "ipam": {
              "type": "calico-ipam",
                          "assign_ipv4": "true"
                                    },
                                                    "policy": {
              "type": "k8s"
            },
                                "kubernetes": {
              "kubeconfig": "__KUBECONFIG_FILEPATH__"
            }
        },
        {
          "type":"portmap",
          "capabilities": {
            "portMappings": true
          }
        },
        {
          "type":"bandwidth",
          "capabilities": {
            "bandwidth": true
          }
        }
      ]
    }
kind: ConfigMap
metadata:
  annotations:
